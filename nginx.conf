# mini-sylar nginx 配置
# 用途：动静分离 —— 静态页面由 nginx 直接返回，API 反向代理到后端
# 安装：sudo cp nginx.conf /etc/nginx/sites-available/default && sudo nginx -t && sudo service nginx start

server {
    listen 80 default_server;
    server_name _;

    # 静态文件根目录（项目 web/ 目录）
    root /mnt/e/program_modified/mini-sylar/web;
    index index.html;

    # 静态文件：/ 、/about.html 、/css/* 、/js/*
    location / {
        try_files $uri $uri/ =404;
    }

    # API 反向代理到 mini-sylar 后端（8080）
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # /text 是后端纯文本接口，也走代理
    location = /text {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
